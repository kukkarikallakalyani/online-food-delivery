<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - Food Express</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .success-box {
            max-width: 500px;
            margin: 60px auto;
            padding: 35px 25px;
            background: white;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .success-icon {
            font-size: 60px;
        }

        .success-box h1 {
            color: #28a745;
        }

        .order-id {
            font-size: 20px;
            font-weight: bold;
            color: #ff5722;
            margin: 20px 0;
        }

        .home-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .home-btn:hover {
            background: #e64a19;
        }
    </style>
</head>

<body>

    <section class="success-box">

        <div class="success-icon">
            🎉
        </div>

        <h1>Order Placed Successfully!</h1>

        <p>
            Thank you for ordering with
            <b>Food Express</b> ❤️
        </p>

        <p class="order-id">
            Order ID:
            <span id="orderId">Loading...</span>
        </p>

        <p>
            💰 Total:
            ₹<span id="orderTotal">0</span>
        </p>

        <p>
            🚴 Your food will be delivered soon!
        </p>

        <button class="home-btn" onclick="goHome()">
            🏠 Back to Home
        </button>

    </section>


    <script>

        const order =
            JSON.parse(
                localStorage.getItem("foodOrder")
            );

        if (order) {

            document.getElementById("orderId")
                .textContent =
                "#" + order.orderId;

            document.getElementById("orderTotal")
                .textContent =
                order.total || 0;

        } else {

            document.getElementById("orderId")
                .textContent =
                "Not Available";

        }


        function goHome() {

            window.location.href =
                "index.html";

        }

    </script>

</body>

</html>
