<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Order - Food Express</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="login">

    <h2>📦 Track Your Order</h2>

    <p>Order ID:
        <strong id="trackingOrderId">Loading...</strong>
    </p>

    <div class="tracking-container">

        <div class="tracking-step active">
            <div class="icon">✅</div>
            <h3>Order Placed</h3>
            <p>Your order has been received.</p>
        </div>

        <div class="tracking-step">
            <div class="icon">👨‍🍳</div>
            <h3>Preparing Food</h3>
            <p>Your food is being prepared.</p>
        </div>

        <div class="tracking-step">
            <div class="icon">🛵</div>
            <h3>Out for Delivery</h3>
            <p>Your order is on the way.</p>
        </div>

        <div class="tracking-step">
            <div class="icon">🏠</div>
            <h3>Delivered</h3>
            <p>Your order has been delivered.</p>
        </div>

    </div>

    <h3 id="currentStatus">📦 Order Placed</h3>

    <button onclick="window.location.href='index.html'">
        🏠 Back to Home
    </button>

</section>


<script>

    // Get Order ID from localStorage
    const orderId = localStorage.getItem("foodExpressOrderId");

    const orderIdElement =
        document.getElementById("trackingOrderId");

    if (orderId) {
        orderIdElement.textContent = orderId;
    } else {
        orderIdElement.textContent = "Order ID not found";
    }


    // Tracking steps
    const steps =
        document.querySelectorAll(".tracking-step");

    const statusText =
        document.getElementById("currentStatus");

    const statuses = [
        "📦 Order Placed",
        "👨‍🍳 Preparing Food",
        "🛵 Out for Delivery",
        "🏠 Delivered"
    ];

    let currentStep = 0;


    // Automatically update status
    const updateTracking = setInterval(() => {

        currentStep++;

        if (currentStep < steps.length) {

            steps[currentStep].classList.add("active");

            statusText.textContent =
                statuses[currentStep];

        } else {

            clearInterval(updateTracking);

        }

    }, 5000);

</script>
<script>

function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (email === "" || password === "") {
        alert("Please enter email and password");
        return;
    }

    localStorage.setItem(
        "foodUser",
        JSON.stringify({
            email: email,
            loggedIn: true
        })
    );

    window.location.href = "index.html";
}

</script>

</body>
</html>
